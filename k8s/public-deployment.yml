apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-deployment
  namespace: snappy-chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public
  template:
    metadata:
      name: public-pod
      namespace: snappy-chat-app
      labels:
        app: public
    spec:
      initContainers:
      - name: wait-for-server
        image: busybox
        command: ['sh', '-c', 'until nc -z snappy-chat-server 5000; do echo "waiting for server..."; sleep 3; done; echo "server is up"']
      containers:
      - name: snappy-app-container
        image: prafuldevops/snappy-chat-public:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 80

